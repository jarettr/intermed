name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

env:
  # Keep Cargo registry access stable on hosted runners; this avoids transient
  # libcurl HTTP/2 framing failures during dependency fetches.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build and regenerate CLI docs
        run: INTERMED_GENERATE_CLI_DOCS=1 cargo build
      - name: Generated CLI docs are current
        run: |
          test -f docs/man/intermed.1
          test -f docs/completions/intermed.bash
          test -f docs/completions/_intermed
          test -f docs/completions/intermed.fish
          test -f docs/completions/_intermed.ps1
          git diff --exit-code -- docs/man docs/completions
      - name: Trust-contract gate
        run: |
          cargo test -p intermed-doctor-core --test trust_contract
          cargo test -p intermed-rules legacy_pack_cannot_emit_an_uncontracted_hard_finding
          cargo test -p intermed-rules columnar_backend_cannot_bypass_legacy_hard_severity_cap
      - name: Query semantic oracle
        run: cargo test -p intermed-columnar --test semantic_oracle
      - name: Test
        run: cargo test --workspace --locked
      - name: Mod-scale benchmarks (50/100/200 mods)
        run: cargo test -p intermed-cli --test mod_scale_bench -- --nocapture
        env:
          INTERMED_JOBS: "2"

  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: DuckDB backend and parity tests
        run: cargo test --locked -p intermed-duckdb --features duckdb --jobs 1
        env:
          CARGO_BUILD_JOBS: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
      - name: CLI duckdb e2e
        run: cargo test --locked -p intermed-cli --features duckdb --test duckdb_e2e --jobs 1
        env:
          CARGO_BUILD_JOBS: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"

  optional-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: DataFusion backend compiles
        run: cargo check --locked -p intermed-columnar --features datafusion-backend
      - name: Polars backend compiles
        run: cargo check --locked -p intermed-columnar --features polars-backend
      - name: Ascent backend compiles
        run: cargo check --locked -p intermed-columnar --features ascent-backend
      - name: WASM backend tests
        run: cargo test --locked -p intermed-columnar --features wasm

  # Dependency security audit (RustSec advisory DB). Fails the build on a known
  # vulnerability; accepted unmaintained-only advisories are listed in
  # .cargo/audit.toml so the check stays green while a real new advisory surfaces.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz smoke targets
        shell: bash
        run: |
          set -euo pipefail
          seconds=15
          if [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=45
          fi
          for target in class_parser deps_semver log_runtime_event log_stacktrace resource_ast resource_json runtime_log tiny_mappings; do
            args=("-max_total_time=${seconds}")
            # cafebabe 0.9.0 retains cyclic Rc entries for some malformed
            # constant pools. Keep ASan/OOB/panic coverage for the class parser,
            # but leave LeakSanitizer enabled for every other target.
            if [ "$target" = class_parser ]; then
              ASAN_OPTIONS=detect_leaks=0 cargo fuzz run "$target" -- "${args[@]}"
              continue
            fi
            cargo fuzz run "$target" -- "${args[@]}"
          done
